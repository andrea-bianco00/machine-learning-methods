name: Q1–Q6 verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Reproduce Q1
        run: |
          python q1.py --output results/q1.json
          python q1_sweep.py --output results --repetitions 400 --seed 42
      - name: Reproduce Q2
        run: python q2.py --n 3000 --p 8 --noise-variance 0.5 --seed 42
      - name: Reproduce Q3
        run: python q3.py --seed 42 --noise-sd 0.5 --output results
      - name: Reproduce Q4
        run: python q4.py --budget 30000 --repeats 5 --data-seed 42 --sgd-seed 100 --output results
      - name: Reproduce Q5 baseline
        run: python q5.py --budget 30000 --repeats 5 --seed 42 --h 0.01 --output results
      - name: Reproduce Q5 sensitivity extension
        run: python q5_sensitivity.py --budget 30000 --repeats 5 --output results
      - name: Reproduce Q6 flexible vs linear regression
        run: python q6.py --budget 120000 --repeats 5 --step-scale 0.03 --output results
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q1-q6-experiments
          path: |
            results/q1.json
            results/q1_sweep.csv
            results/q1_*.png
            results/q2.json
            results/q2_signals.png
            results/q3.json
            results/q3.csv
            results/q3_*.png
            results/q4.json
            results/q4.csv
            results/q4_*.png
            results/q5.json
            results/q5.csv
            results/q5_convergence.png
            results/q5_sensitivity.json
            results/q5_sensitivity.csv
            results/q5_sensitivity.png
            results/q6.json
            results/q6_runs.csv
            results/q6_trajectories.csv
            results/q6_comparison.png
